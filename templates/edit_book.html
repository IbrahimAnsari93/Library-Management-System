<!DOCTYPE html>
<html>
<head>
    <title>Edit Book</title>
</head>

<body>

<h1>✏️ Edit Book</h1>

<form method="POST">

    {% csrf_token %}

    <label>Book Title</label><br>
    <input
        type="text"
        name="title"
        value="{{ book.title }}"
        required
    ><br><br>

    <label>Author</label><br>
    <input
        type="text"
        name="author"
        value="{{ book.author }}"
        required
    ><br><br>

    <label>ISBN</label><br>
    <input
        type="text"
        name="isbn"
        value="{{ book.isbn }}"
        required
    ><br><br>

    <label>Category</label><br>
    <input
        type="text"
        name="category"
        value="{{ book.category }}"
        required
    ><br><br>

    <label>Quantity</label><br>
    <input
        type="number"
        name="quantity"
        value="{{ book.quantity }}"
        min="1"
        required
    ><br><br>

    <button type="submit">
        Update Book
    </button>

</form>

<br>

<a href="{% url 'book_list' %}">
    ← Back to Books
</a>

</body>
</html>
