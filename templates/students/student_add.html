
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            padding: 30px;
        }

        .container {
            max-width: 600px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            text-align: center;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #2563eb;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .info {
            background: #eff6ff;

            color: #1e40af;

            padding: 15px;

            border-radius: 7px;

            margin-bottom: 20px;

            line-height: 1.6;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            text-decoration: none;

            color: #2563eb;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        👨‍🎓 Add Student
    </h1>


    <div class="info">

        <strong>Student Login Account</strong>

        <br>

        Username will be the student's email.

        <br>

        Password will be the student's roll number.

    </div>


    <form method="POST">

        {% csrf_token %}


        <label for="name">
            Student Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter student name"
            required
        >


        <label for="roll_no">
            Roll Number
        </label>

        <input
            type="text"
            id="roll_no"
            name="roll_no"
            placeholder="Enter roll number"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email"
            required
        >


        <label for="phone">
            Phone
        </label>

        <input
            type="text"
            id="phone"
            name="phone"
            placeholder="Enter phone number"
            required
        >


        <button type="submit">
            ➕ Add Student
        </button>

    </form>


    <a
        class="back"
        href="{% url 'student_list' %}"
    >
        ← Back to Students
    </a>


</div>


</body>

</html>
