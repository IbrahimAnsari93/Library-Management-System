<!DOCTYPE html>
<html>

<head>
    <title>Edit Student</title>
</head>

<body>

<h2>Edit Student</h2>

<form method="POST">

    {% csrf_token %}

    <p>
        Name:
        <input
            type="text"
            name="name"
            value="{{ student.name }}"
            required
        >
    </p>

    <p>
        Roll No:
        <input
            type="text"
            name="roll_no"
            value="{{ student.roll_no }}"
            required
        >
    </p>

    <p>
        Email:
        <input
            type="email"
            name="email"
            value="{{ student.email }}"
            required
        >
    </p>

    <p>
        Phone:
        <input
            type="text"
            name="phone"
            value="{{ student.phone }}"
            required
        >
    </p>

    <button type="submit">
        Update Student
    </button>

</form>

<br>

<a href="{% url 'student_list' %}">
    ← Back
</a>

</body>
</html>
