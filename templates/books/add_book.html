<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.1);
        }

        .help-text {
            display: block;
            margin-top: 5px;
            font-size: 13px;
            color: #777;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .submit-btn {
            background: #28a745;
            color: white;
        }

        .submit-btn:hover {
            background: #218838;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
        }

        .cancel-btn:hover {
            background: #5a6268;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                width: 100%;
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Add New Book</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="title">📖 Book Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter book title"
                value="{{ title|default:'' }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="author">✍️ Author</label>

            <input
                type="text"
                id="author"
                name="author"
                placeholder="Enter author name"
                value="{{ author|default:'' }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="isbn">🔢 ISBN</label>

            <input
                type="text"
                id="isbn"
                name="isbn"
                placeholder="Enter unique ISBN"
                value="{{ isbn|default:'' }}"
                required
            >

            <span class="help-text">
                ISBN must be unique.
            </span>
        </div>

        <div class="form-group">
            <label for="category">🏷️ Category</label>

            <input
                type="text"
                id="category"
                name="category"
                placeholder="Example: Programming, Science, Chemistry"
                value="{{ category|default:'General' }}"
            >
        </div>

        <div class="form-group">
            <label for="quantity">📦 Quantity</label>

            <input
                type="number"
                id="quantity"
                name="quantity"
                min="0"
                value="{{ quantity|default:'1' }}"
                required
            >

            <span class="help-text">
                Enter the number of available copies.
            </span>
        </div>

        <div class="buttons">

            <button
                type="submit"
                class="btn submit-btn"
            >
                ➕ Add Book
            </button>

            <a
                href="{% url 'book_list' %}"
                class="btn cancel-btn"
            >
                ← Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
